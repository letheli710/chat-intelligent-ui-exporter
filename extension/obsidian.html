<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Obsidian</title>
<script src="locales/en.js"></script>
<script src="locales/zh_CN.js"></script>
<script src="locales/zh_TW.js"></script>
<script src="locales/ja.js"></script>
<script src="locales/ko.js"></script>
<script src="locales/es.js"></script>
<script src="locales/pt_BR.js"></script>
<script src="locales/fr.js"></script>
<script src="locales/de.js"></script>
<script src="locales/ru.js"></script>
<script src="i18n.js"></script>
<script src="settings.js"></script>
<script src="ui-kit.js"></script>
<style>
html,body{margin:0}
body.cx{background:var(--bg);color:var(--text);font-size:14px}
main{max-width:560px;margin:56px auto;padding:0 16px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.top b{flex:1;font-size:17px;font-weight:600}
.card{background:var(--surface);border-radius:20px;padding:18px 20px}
.what{font-size:12px;color:var(--muted);font-weight:500}
#conv{font-size:17px;font-weight:600;line-height:1.4;margin-top:2px;overflow-wrap:anywhere}
.dest{display:flex;gap:8px;align-items:baseline;margin-top:10px;font-size:13.5px}
.dest .what{flex:none}
#dest{font-size:13.5px}
#status{margin-top:16px;font-size:15px;line-height:1.6;white-space:pre-wrap;color:var(--text)}
#status.warn{color:color-mix(in srgb,var(--err) 75%,var(--text))}
#hint{margin-top:6px;font-size:13.5px;line-height:1.65;color:var(--text);white-space:pre-wrap}
#hint b{color:var(--pri-deep)}
#actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
#actions .xb{font-size:14px;padding:10px 18px}
#actions .xb.pri{flex:none}
details{margin-top:14px;font-size:12px;color:var(--muted)}
#log{white-space:pre-wrap;font:12px/1.5 ui-monospace,Consolas,monospace;max-height:240px;overflow:auto;margin:8px 0 0}
</style>
</head>
<body class="cx">
<main>
  <div class="top"><div class="logo"></div><b data-i18n="obs.title"></b><span class="xver" id="version"></span></div>
  <div class="card">
    <div class="what" id="convLab" data-i18n="obs.conv"></div>
    <div id="conv" data-i18n="obs.receiving"></div>
    <div class="dest"><span class="what" data-i18n="obs.dest"></span><span class="chip" id="dest">—</span></div>
    <div id="status" role="status" data-i18n="obs.waiting"></div>
    <div id="hint" hidden></div>
    <div id="actions">
      <button class="xb pri" id="pick" type="button" hidden data-i18n="obs.pick"></button>
      <button class="xb pri" id="grant" type="button" hidden data-i18n="obs.grant"></button>
      <button class="xb pri" id="write" type="button" hidden data-i18n="obs.rewrite"></button>
      <button class="xb pri" id="open" type="button" hidden data-i18n="obs.open"></button>
      <button class="xb ghost" id="repick" type="button" hidden data-i18n="obs.repick"></button>
    </div>
  </div>
  <details><summary data-i18n="obs.log"></summary><pre id="log"></pre></details>
</main>
<script src="obsidian-send.js"></script>
</body>
</html>
